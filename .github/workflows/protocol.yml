name: Protocol regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire-schema:
    name: Independent emitted-message schema checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: interop/schema_validation/package-lock.json
      - name: Compile the real server
        run: |
          mix local.hex --force
          mix deps.get
          mix compile --warnings-as-errors
      - name: Validate emitted messages and negative controls
        run: |
          set -o pipefail
          mkdir -p tmp/schema-validation
          npm ci --prefix interop/schema_validation --ignore-scripts
          npm run check --prefix interop/schema_validation 2>&1 | tee tmp/schema-validation/check.log
      - name: Preserve independent schema evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-wire-schema
          path: tmp/schema-validation/
          if-no-files-found: warn
  conformance:
    name: Frozen MCP 2026-07-28 regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: conformance/package-lock.json
      - name: Prepare combined fixture
        working-directory: conformance/fixture
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile --warnings-as-errors
      - name: Install pinned runner and test evidence accounting
        working-directory: conformance
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Run frozen suite with strict per-check regression baseline
        working-directory: conformance
        run: npm run check
      - name: Preserve raw failures and separate conformance score
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-conformance
          path: tmp/conformance/server/
          if-no-files-found: warn
  conformance-lanes:
    name: Official conformance lane ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [server-plug, server-2025-11-25, server-2025-06-18]
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: conformance/package-lock.json
      - name: Prepare fixture
        working-directory: conformance/fixture
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile --warnings-as-errors
      - name: Install pinned runner
        working-directory: conformance
        run: npm ci --ignore-scripts
      - name: Run the lane with its strict per-check regression baseline
        working-directory: conformance
        run: node run.mjs ${{ matrix.lane }}
      - name: Preserve raw results and separate score
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-conformance-${{ matrix.lane }}
          path: tmp/conformance/${{ matrix.lane }}/
          if-no-files-found: warn
  client-conformance:
    name: Frozen MCP 2026-07-28 client regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: conformance/package-lock.json
      - name: Compile Snodo.Client
        run: |
          mix local.hex --force
          mix deps.get
          mix compile --warnings-as-errors
      - name: Install pinned runner and test evidence accounting
        working-directory: conformance
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Run frozen client suite with strict per-check regression baseline
        working-directory: conformance
        run: npm run check:client
      - name: Preserve raw client results and separate client score
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-conformance-client
          path: tmp/conformance/client/
          if-no-files-found: warn
