name: Release Please

on:
  push:
    branches: [main]
  # Publishes an existing release tag, for when publish-hex did not run or
  # failed partway. Packages already on Hex are skipped.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, such as v0.1.0"
        required: true

# Jobs request only what they need.
permissions: {}

# A manual publish and an automatic one never overlap, so the "already on Hex"
# check cannot race.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A pull request opened or updated with the workflow token starts no
      # other workflows without approval. RELEASE_PLEASE_TOKEN (a fine-grained
      # token with read-write Contents, Pull requests, and Issues on this
      # repository) avoids that. An empty secret falls back to the workflow
      # token; a set but invalid one fails the run. See RELEASING.md.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-hex:
    name: Publish to Hex.pm
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # HEX_API_KEY can live in this environment, which can be limited to v*
    # tags and require a reviewer (repository settings).
    environment: hex
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      MIX_ENV: dev
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Check the tag name
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z release tag"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      # A manual run could otherwise publish any branch or commit.
      - name: Check the tag is a release of main
        run: |
          git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null ||
            { echo "::error::$TAG is not a tag"; exit 1; }
          git merge-base --is-ancestor "$TAG" origin/main ||
            { echo "::error::$TAG is not on main"; exit 1; }
          version="${TAG#v}"
          for file in mix.exs extensions/tasks/mix.exs extensions/tasks_postgres/mix.exs \
                      extensions/tasks_sqlite/mix.exs integrations/plug/mix.exs \
                      integrations/schema_jsv/mix.exs integrations/telemetry/mix.exs; do
            grep -q "@version \"$version\"" "$file" ||
              { echo "::error::$file does not declare version $version"; exit 1; }
          done
      - name: Check the GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" >/dev/null
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - name: Install package managers
        run: |
          mix local.hex --force
          mix local.rebar --force
      # The siblings depend on the released snodo (the Tasks stores, and the
      # snodo_telemetry tests, on the released snodo_tasks), so publish in
      # dependency order. A package whose version is already on Hex is
      # skipped, so the job can be rerun.
      - name: Publish all seven packages
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          version="${TAG#v}"

          published() {
            mix hex.info "$1" "$version" >/dev/null 2>&1
          }

          # Wait for the previous tier to appear in the Hex index.
          fetch() {
            for attempt in $(seq 1 20); do
              if SNODO_HEX=1 mix deps.get; then return 0; fi
              echo "Waiting for the Hex index ($attempt)"
              sleep 30
            done
            return 1
          }

          publish() {
            package="$1"
            dir="$2"
            if published "$package"; then
              echo "$package $version is already on Hex"
              return 0
            fi
            (cd "$dir" && fetch && SNODO_HEX=1 mix hex.publish --yes)
          }

          publish snodo .
          publish snodo_tasks extensions/tasks
          publish snodo_plug integrations/plug
          publish snodo_jsv integrations/schema_jsv
          publish snodo_telemetry integrations/telemetry
          publish snodo_tasks_postgres extensions/tasks_postgres
          publish snodo_tasks_sqlite extensions/tasks_sqlite
      - name: Build all seven release tarballs
        run: |
          version="${TAG#v}"
          mkdir -p release

          build() {
            package="$1"
            dir="$2"
            (cd "$dir" && SNODO_HEX=1 mix hex.build \
              --output "$GITHUB_WORKSPACE/release/$package-$version.tar")
          }

          build snodo .
          build snodo_tasks extensions/tasks
          build snodo_plug integrations/plug
          build snodo_jsv integrations/schema_jsv
          build snodo_telemetry integrations/telemetry
          build snodo_tasks_postgres extensions/tasks_postgres
          build snodo_tasks_sqlite extensions/tasks_sqlite

          test "$(find release -maxdepth 1 -name '*.tar' -type f | wc -l)" -eq 7
      # hex.publish builds its own archive. Compare the later local build with
      # what Hex serves before making a provenance claim about published bytes.
      - name: Verify release tarballs against Hex
        run: |
          version="${TAG#v}"

          verify() {
            package="$1"
            built="release/$package-$version.tar"
            fetched="$RUNNER_TEMP/$package-$version.tar"
            for attempt in $(seq 1 20); do
              rm -f "$fetched"
              if mix hex.package fetch "$package" "$version" --output "$RUNNER_TEMP"; then
                break
              fi
              echo "Waiting for $package $version on Hex ($attempt)"
              sleep 30
            done
            test -s "$fetched" ||
              { echo "::error::Could not fetch $package $version from Hex"; exit 1; }
            cmp -s "$built" "$fetched" ||
              { echo "::error::$package $version differs from the Hex tarball"; exit 1; }
          }

          verify snodo
          verify snodo_tasks
          verify snodo_plug
          verify snodo_jsv
          verify snodo_telemetry
          verify snodo_tasks_postgres
          verify snodo_tasks_sqlite
      - name: Attest release tarballs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.tar
      - name: Attach verified tarballs to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          mkdir -p "$RUNNER_TEMP/release-assets"

          for tarball in release/*.tar; do
            name="${tarball##*/}"
            if grep -Fxq "$name" <<<"$existing"; then
              gh release download "$TAG" --pattern "$name" \
                --dir "$RUNNER_TEMP/release-assets"
              cmp -s "$tarball" "$RUNNER_TEMP/release-assets/$name" ||
                { echo "::error::Existing release asset $name differs"; exit 1; }
            else
              gh release upload "$TAG" "$tarball"
            fi
          done
