name: Compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beam:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18"
            otp: "27"
            lane: minimum
          - elixir: "1.19"
            otp: "28"
            lane: intermediate
          - elixir: "1.20"
            otp: "29"
            lane: current
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Install package managers
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Fetch all package dependencies
        run: |
          mix deps.get
          mix cmd --cd extensions/tasks mix deps.get
          mix cmd --cd extensions/tasks_postgres mix deps.get
          mix cmd --cd extensions/tasks_sqlite mix deps.get
          mix cmd --cd integrations/plug mix deps.get
          mix cmd --cd integrations/schema_jsv mix deps.get
      - name: Run aggregate quality
        run: mix quality
      - name: Run aggregate type analysis on the current lane
        if: matrix.lane == 'current'
        run: mix quality.types
      - name: Build documentation on the current lane
        if: matrix.lane == 'current'
        run: MIX_ENV=dev mix docs --warnings-as-errors

  official-client:
    name: Official TypeScript client 2.0.0
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MIX_ENV: dev
      ERL_FLAGS: "+S 4:4"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: interop/official_client/package-lock.json
      - name: Build framework public APIs
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile --warnings-as-errors
      - name: Install pinned official client
        working-directory: interop/official_client
        run: npm ci --ignore-scripts
      - name: Run baseline, MRTR, and progress acceptance
        working-directory: interop/official_client
        shell: bash
        run: npm run check 2>&1 | tee official-client.log
      - name: Upload official-client evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-client-acceptance
          path: interop/official_client/official-client.log
          if-no-files-found: ignore
          retention-days: 14

  postgres:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: snodo_tasks
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d snodo_tasks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SNODO_TASKS_DATABASE_URL: ecto://postgres:postgres@127.0.0.1:5432/snodo_tasks
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - name: Install package managers
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Fetch PostgreSQL package dependencies
        working-directory: extensions/tasks_postgres
        run: mix deps.get
      - name: Run live PostgreSQL contract and walkthrough
        working-directory: extensions/tasks_postgres
        run: mix quality.postgres
