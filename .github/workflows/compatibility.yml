name: Compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request shares one group per ref, and a newer push cancels the older
  # run. Pushes to main get one group per commit: GitHub keeps only one pending
  # run per group and cancels the older pending one even without
  # cancel-in-progress, so a shared group would drop queued main runs.
  group: compatibility-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  beam:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18"
            otp: "27"
            lane: minimum
          - elixir: "1.19"
            otp: "28"
            lane: intermediate
          - elixir: "1.20"
            otp: "29"
            lane: current
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      # Building PLTs takes most of the type analysis step: dialyxir's core PLT
      # in ~/.mix and one PLT per package. Restore them keyed on the toolchain
      # and the repository's lockfiles (hashed before deps/ exists); dialyxir
      # updates a restored PLT that is out of date.
      - name: Restore Dialyzer PLTs
        if: matrix.lane == 'current'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.mix/dialyxir_*
            **/priv/plts
          key: plts-${{ runner.os }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            plts-${{ runner.os }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-
      - name: Install package managers
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Fetch all package dependencies
        run: mix setup
      - name: Run aggregate quality
        run: mix quality
      - name: Run aggregate type analysis on the current lane
        if: matrix.lane == 'current'
        run: mix quality.types
      - name: Build documentation on the current lane
        if: matrix.lane == 'current'
        run: MIX_ENV=dev mix docs --warnings-as-errors

  packaging:
    name: Hex packaging dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - name: Install package managers
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Build the core package
        run: |
          mix deps.get
          mix hex.build
      # Each sibling builds with SNODO_HEX=1, as it is published, and builds
      # its HexDocs with the in-repository path dependencies.
      - name: Build each sibling package and its docs
        run: |
          for dir in extensions/tasks integrations/plug integrations/schema_jsv \
            integrations/oauth integrations/telemetry integrations/proxy integrations/otp \
            extensions/tasks_postgres extensions/tasks_sqlite; do
            echo "::group::$dir"
            (cd "$dir" && SNODO_HEX=1 mix hex.build && mix deps.get && mix docs --warnings-as-errors)
            echo "::endgroup::"
          done

  official-client:
    name: Official TypeScript client 2.0.0
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MIX_ENV: dev
      ERL_FLAGS: "+S 4:4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: interop/official_client/package-lock.json
      - name: Build framework public APIs
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile --warnings-as-errors
      - name: Build snodo_oauth for the resource server fixture
        working-directory: integrations/oauth
        run: |
          mix deps.get
          mix compile --warnings-as-errors
      - name: Install pinned official client
        working-directory: interop/official_client
        run: npm ci --ignore-scripts
      - name: Run baseline, MRTR, progress, and OAuth resource server acceptance
        working-directory: interop/official_client
        shell: bash
        run: npm run check 2>&1 | tee official-client.log
      - name: Upload official-client evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: official-client-acceptance
          path: interop/official_client/official-client.log
          if-no-files-found: ignore
          retention-days: 14

  official-python:
    name: Official Python client 2.0.0
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MIX_ENV: dev
      ERL_FLAGS: "+S 4:4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.0"
      - name: Build framework public APIs
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile --warnings-as-errors
      - name: Install locked official Python client
        working-directory: interop/official_python
        run: |
          python -m pip install uv==0.12.21
          uv sync --frozen
      - name: Run Python client acceptance
        working-directory: interop/official_python
        shell: bash
        run: uv run --frozen python check.py 2>&1 | tee official-python.log
      - name: Upload official Python evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: official-python-acceptance
          path: interop/official_python/official-python.log
          if-no-files-found: ignore
          retention-days: 14

  postgres:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: snodo_tasks
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d snodo_tasks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SNODO_TASKS_DATABASE_URL: ecto://postgres:postgres@127.0.0.1:5432/snodo_tasks
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - name: Install package managers
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Fetch PostgreSQL package dependencies
        working-directory: extensions/tasks_postgres
        run: mix deps.get
      - name: Run live PostgreSQL contract and walkthrough
        working-directory: extensions/tasks_postgres
        run: mix quality.postgres
