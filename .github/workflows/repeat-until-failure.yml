name: Repeat until failure

# Runs each package's suite many times in one VM, with a new seed each run, to
# find tests that fail only under load or with an unlucky ordering. Three
# variants per package: default schedulers, two schedulers (ERL_FLAGS="+S 2:2"),
# and default schedulers with competing CPU load. Informational: it is not a
# required check. A failure uploads the log and opens or updates one issue per
# package, labeled `flaky`, naming the test and the seed.
on:
  schedule:
    - cron: "43 5 * * 0"
  workflow_dispatch:
    inputs:
      repeat:
        description: "Runs per variant (mix test --repeat-until-failure)"
        type: number
        default: 30
      package:
        description: "Package to run, or all"
        type: choice
        default: all
        options:
          - all
          - snodo
          - snodo_plug
          - snodo_jsv
          - snodo_oauth
          - snodo_telemetry
          - snodo_tasks
          - snodo_tasks_postgres
          - snodo_tasks_sqlite

# Jobs request only what they need.
permissions: {}

concurrency:
  group: repeat-until-failure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select packages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - id: plan
        env:
          PACKAGE: ${{ inputs.package || 'all' }}
        run: |
          all='[
            {"name": "snodo", "dir": "."},
            {"name": "snodo_plug", "dir": "integrations/plug"},
            {"name": "snodo_jsv", "dir": "integrations/schema_jsv"},
            {"name": "snodo_oauth", "dir": "integrations/oauth"},
            {"name": "snodo_telemetry", "dir": "integrations/telemetry"},
            {"name": "snodo_tasks", "dir": "extensions/tasks"},
            {"name": "snodo_tasks_postgres", "dir": "extensions/tasks_postgres",
             "args": "--include postgres_live", "postgres": true},
            {"name": "snodo_tasks_sqlite", "dir": "extensions/tasks_sqlite"}
          ]'
          packages=$(jq -c --arg p "$PACKAGE" \
            'map(select($p == "all" or .name == $p))' <<<"$all")
          test "$(jq length <<<"$packages")" -gt 0 ||
            { echo "::error::Unknown package '$PACKAGE'"; exit 1; }
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.package.name }} (${{ matrix.variant }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
        variant: [default, two-schedulers, cpu-load]
    # The live PostgreSQL tests need a database; an empty image starts no
    # service for the other packages.
    services:
      postgres:
        image: ${{ matrix.package.postgres && 'postgres:18-alpine' || '' }}
        env:
          POSTGRES_DB: snodo_tasks
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d snodo_tasks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MIX_ENV: test
      REPEAT: ${{ inputs.repeat || 30 }}
      PACKAGE: ${{ matrix.package.name }}
      VARIANT: ${{ matrix.variant }}
      TEST_ARGS: ${{ matrix.package.args }}
      ERL_FLAGS: ${{ matrix.variant == 'two-schedulers' && '+S 2:2' || '' }}
      SNODO_TASKS_DATABASE_URL: ${{ matrix.package.postgres && 'ecto://postgres:postgres@127.0.0.1:5432/snodo_tasks' || '' }}
    defaults:
      run:
        working-directory: ${{ matrix.package.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - name: Install package managers
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Fetch dependencies and compile
        run: |
          mix deps.get
          mix compile
      - name: Run the suite until it fails
        id: run
        timeout-minutes: 160
        shell: bash
        run: |
          [[ "$REPEAT" =~ ^[1-9][0-9]*$ ]] ||
            { echo "::error::repeat must be a positive integer, got '$REPEAT'"; exit 1; }
          if [ "$VARIANT" = cpu-load ]; then
            # Two busy processes per core compete with the schedulers.
            for _ in $(seq $(( $(nproc) * 2 ))); do yes > /dev/null & done
            trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          fi
          mkdir -p "$RUNNER_TEMP/repeat"
          # TEST_ARGS is a list of flags, split on purpose.
          # shellcheck disable=SC2086
          mix test $TEST_ARGS --repeat-until-failure "$REPEAT" --max-failures 1 2>&1 |
            tee "$RUNNER_TEMP/repeat/$PACKAGE--$VARIANT.log"
      - name: Summarize the failure
        if: failure() && steps.run.outcome == 'failure'
        shell: bash
        env:
          DIR: ${{ matrix.package.dir }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          log="$RUNNER_TEMP/repeat/$PACKAGE--$VARIANT.log"
          summary="$RUNNER_TEMP/repeat/$PACKAGE--$VARIANT.md"

          # Each run starts with "Running ExUnit with seed: N, ..."; the first
          # numbered failure ends the search, since --max-failures 1 stops the
          # suite in the run that failed.
          IFS=$'\t' read -r seed run test location < <(awk '
            /^Running ExUnit with seed: / { seed = $5; sub(/,$/, "", seed); run++ }
            /^ +1\) / {
              test = $0; sub(/^ +1\) /, "", test)
              getline location; gsub(/^ +| +$/, "", location)
              found = 1; exit
            }
            END {
              if (!found) { test = "-"; location = "-" }
              printf "%s\t%d\t%s\t%s\n", (seed == "" ? "-" : seed), run, test, location
            }' "$log")

          prefix=""
          [ "$DIR" = . ] || prefix="$DIR/"
          case "$VARIANT" in
            two-schedulers) setting="\`ERL_FLAGS=\"+S 2:2\"\`"; flags='ERL_FLAGS="+S 2:2" ' ;;
            cpu-load) setting="default schedulers, $(( $(nproc) * 2 )) competing \`yes\` processes"; flags='' ;;
            *) setting='default schedulers'; flags='' ;;
          esac
          rerun="${flags}mix test${TEST_ARGS:+ $TEST_ARGS} --seed $seed"
          [ "$DIR" = . ] || rerun="(cd $DIR && $rerun)"

          {
            echo "### $PACKAGE, $VARIANT"
            echo
            if [ "$test" = "-" ]; then
              echo "- Test: none in the log; the run may have crashed or timed out"
            else
              echo "- Test: \`$test\`"
              echo "- Location: \`$prefix$location\`"
            fi
            echo "- Seed: \`$seed\`, on run $run of $REPEAT"
            echo "- Variant: $setting"
            echo "- Commit: \`$SHA\` on \`$REF\`"
            echo "- Rerun the same ordering: \`$rerun\`"
            echo
            echo "<details><summary>Failure output</summary>"
            echo
            echo '~~~text'
            if [ "$test" = "-" ]; then
              tail -n 60 "$log"
            else
              sed -n '/^ \{1,\}1) /,$p' "$log" | head -n 80
            fi
            echo '~~~'
            echo
            echo "</details>"
            echo
          } > "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the log
        if: failure() && steps.run.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repeat-until-failure-${{ matrix.package.name }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/repeat/
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Open or update flaky-test issues
    needs: test
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: repeat-until-failure-*
          path: ${{ runner.temp }}/repeat
          merge-multiple: true
      - name: Open or update one issue per package
        shell: bash
        working-directory: ${{ runner.temp }}/repeat
        run: |
          shopt -s nullglob
          summaries=(*.md)
          if [ ${#summaries[@]} -eq 0 ]; then
            echo "No failure summaries; the failure was outside the test step. See $RUN_URL."
            exit 0
          fi

          gh label create flaky --color d93f0b \
            --description "Found by the repeat-until-failure workflow" 2>/dev/null || true
          open=$(gh issue list --state open --label flaky --limit 200 --json number,title)

          for package in $(printf '%s\n' "${summaries[@]}" | sed 's/--.*//' | sort -u); do
            title="test: flaky test in $package"
            body="$RUNNER_TEMP/$package-issue.md"
            {
              echo "The repeat-until-failure workflow found a failing test in \`$package\`: $RUN_URL"
              echo
              echo "The log for each failing variant is in the run's \`repeat-until-failure-$package-*\` artifacts."
              echo
              cat "$package"--*.md
            } > "$body"

            number=$(jq -r --arg title "$title" \
              'map(select(.title == $title)) | first | .number // empty' <<<"$open")
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file "$body"
            else
              gh issue create --title "$title" --label flaky --body-file "$body"
            fi
          done
