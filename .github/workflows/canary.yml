name: Conformance canary

# Runs the conformance legs against runner builds newer than the pin, so
# upstream changes show up before a deliberate bump. This is not a required
# check. Differences and execution errors open or update one issue per lane.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: conformance-canary
  # Do not cancel a running report.
  cancel-in-progress: false

jobs:
  canary:
    name: ${{ matrix.lane }} against ${{ matrix.runner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [alpha, upstream-main]
        lane: [server, server-plug, server-proxy, server-2025-11-25, server-2025-06-18, client, client-2025-11-25]
    env:
      MIX_ENV: dev
      RUNNER: ${{ matrix.runner }}
      LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the pin
        run: |
          output="$RUNNER_TEMP/canary/$RUNNER--$LANE/results"
          mkdir -p "$output"
          echo "MCP_CONFORMANCE_OUTPUT=$output" >> "$GITHUB_ENV"
          pinned=$(jq -r '.dependencies["@modelcontextprotocol/conformance"]' conformance/package.json)
          echo "PINNED=$pinned" >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # No npm cache: this job installs unpinned upstream packages, and the
        # cache would be restored by the gating workflows.
        with:
          node-version: "24.21.0"
      - name: Compile the client and the fixture
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
          cd conformance/fixture
          mix deps.get
          mix compile
      - name: Install report dependencies
        working-directory: conformance
        run: npm ci --ignore-scripts
      - name: Install the alpha dist-tag
        if: matrix.runner == 'alpha'
        run: |
          alpha=$(npm view @modelcontextprotocol/conformance dist-tags.alpha)
          echo "@modelcontextprotocol/conformance@$alpha" > "$MCP_CONFORMANCE_OUTPUT/../runner.txt"
          npm install --prefix "$RUNNER_TEMP/runner" --ignore-scripts "@modelcontextprotocol/conformance@$alpha"
          echo "MCP_CONFORMANCE_RUNNER=$RUNNER_TEMP/runner/node_modules/@modelcontextprotocol/conformance" >> "$GITHUB_ENV"
          if [ "$alpha" = "$PINNED" ]; then
            echo "The alpha dist-tag is the pinned version, $PINNED." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The alpha dist-tag is **$alpha**; the pinned version is $PINNED." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build upstream main
        if: matrix.runner == 'upstream-main'
        run: |
          git clone --depth 1 https://github.com/modelcontextprotocol/conformance "$RUNNER_TEMP/runner"
          cd "$RUNNER_TEMP/runner"
          echo "upstream main at $(git rev-parse HEAD)" > "$MCP_CONFORMANCE_OUTPUT/../runner.txt"
          npm ci --ignore-scripts
          npm run build
          echo "MCP_CONFORMANCE_RUNNER=$RUNNER_TEMP/runner" >> "$GITHUB_ENV"
          echo "Upstream main is at $(git rev-parse --short HEAD)." >> "$GITHUB_STEP_SUMMARY"
      - name: Run the lane
        id: run
        working-directory: conformance
        run: node run.mjs "$LANE" 2>&1 | tee "$MCP_CONFORMANCE_OUTPUT/../lane.log"
      - name: Summarize differences or execution errors
        if: always()
        env:
          OUTCOME: ${{ steps.run.outcome }}
        shell: bash
        run: |
          MCP_CONFORMANCE_OUTPUT="$RUNNER_TEMP/canary/$RUNNER--$LANE/results"
          mkdir -p "$MCP_CONFORMANCE_OUTPUT"
          prefix="$RUNNER_TEMP/canary/$RUNNER--$LANE"
          shopt -s nullglob
          summaries=("$MCP_CONFORMANCE_OUTPUT"/*/summary.json)
          summary="${summaries[0]:-}"
          echo error > "$prefix.status"
          if [ "$OUTCOME" = success ] && [ -n "$summary" ] &&
             jq -e '.regression.passed == true' "$summary" > /dev/null; then
            echo match > "$prefix.status"
            exit 0
          fi

          {
            echo "### $LANE against $RUNNER"
            echo
            echo "- Pin: \`${PINNED:-unknown}\`"
            if [ -f "$MCP_CONFORMANCE_OUTPUT/../runner.txt" ]; then
              echo "- Runner: $(cat "$MCP_CONFORMANCE_OUTPUT/../runner.txt")"
            else
              echo "- Runner: $RUNNER (setup did not record a resolved version or commit)"
            fi
            echo "- Lane step outcome: $OUTCOME"
            echo "- Artifact: \`conformance-canary-$RUNNER-$LANE\` (full logs, summaries, and raw checks)"
            echo
            if [ -n "$summary" ] && jq -e '.regression | type == "object"' "$summary" > /dev/null 2>&1; then
              jq -r '
                "Raw runner exit: \(.runnerExitCode). Baseline matches: \(.regression.passed).",
                "",
                (.regression | to_entries[] | select(.value | type == "array") |
                  "\(.key): \(.value | length)",
                  (.value[:50][] | if type == "object" then
                    "- \(.scenario):\(.id)[\(.occurrence)]: \(.expected // "absent") -> \(.actual // "absent")"
                  else "- \(.)" end)),
                "",
                "At most 50 entries per category are shown. See summary.json in the artifact for all differences."
              ' "$summary"
              if jq -e '.regression.passed == false' "$summary" > /dev/null; then
                echo difference > "$prefix.status"
              else
                echo "The baseline matched, but the lane failed after producing its summary. Check the logs."
              fi
            else
              echo "No valid baseline summary was produced. Check the job and artifact logs for a setup failure, runner crash, or timeout."
            fi
          } > "$prefix.md"
          cat "$prefix.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve canary results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-canary-${{ matrix.runner }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/canary/
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Open or update conformance canary issues
    needs: canary
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: conformance-canary-*
          path: ${{ runner.temp }}/canary
          merge-multiple: true
      - name: Open or update one issue per lane
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/canary"
          cd "$RUNNER_TEMP/canary"
          # Only fixed runner and lane names determine paths and issue titles.
          runners=(alpha upstream-main)
          lanes=(server server-plug server-proxy server-2025-11-25 server-2025-06-18 client client-2025-11-25)
          open=""
          for lane in "${lanes[@]}"; do
            files=()
            for runner in "${runners[@]}"; do
              prefix="$runner--$lane"
              if [ -f "$prefix.status" ] && [ "$(cat "$prefix.status")" = match ]; then
                continue
              fi
              if [ ! -f "$prefix.md" ]; then
                echo "### $lane against $runner: no report artifact. The job may have failed or timed out before upload. See $RUN_URL." > "$prefix.md"
              fi
              files+=("$prefix.md")
            done
            [ ${#files[@]} -gt 0 ] || continue
            if [ -z "$open" ]; then
              open=$(gh issue list --state open --label area/ci --limit 200 --json number,title)
            fi
            title="ci: conformance canary differs from pin in $lane"
            body="$RUNNER_TEMP/$lane-canary-issue.md"
            {
              echo "The conformance canary found baseline differences or execution errors: $RUN_URL"
              echo
              echo "These results do not change the reviewed pin or baselines. Review the differences before updating either."
              echo
              cat -- "${files[@]}"
            } > "$body"
            # Keep both runner excerpts within GitHub's issue body limit. Full
            # evidence remains in the artifacts linked by the run URL.
            if [ "$(wc -c < "$body")" -gt 60000 ]; then
              head -c 60000 "$body" > "$body.excerpt"
              printf '\n\nReport truncated. See the run artifacts for the full evidence.\n' >> "$body.excerpt"
              mv "$body.excerpt" "$body"
            fi
            number=$(jq -r --arg title "$title" \
              'map(select(.title == $title)) | first | .number // empty' <<<"$open")
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file "$body"
            else
              gh issue create --title "$title" --label area/ci --body-file "$body"
            fi
          done
